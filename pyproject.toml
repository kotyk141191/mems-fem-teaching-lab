[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memslab"
version = "1.0.0"
description = "Competency-based MEMS finite-element teaching laboratory on a free, open-source toolchain"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mykhailo Kotyk", email = "mykhaylo.kotyk@pnu.edu.ua" }]
keywords = ["MEMS", "finite element method", "engineering education",
            "open-source software", "competency-based assessment",
            "piezoresistive pressure sensor"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.24", "scipy>=1.10", "pandas>=2.0",
  "matplotlib>=3.7", "scikit-fem>=8.0",
]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4.0", "gmsh>=4.11", "openpyxl>=3.1"]
dev = ["pytest>=7.4", "nbclient>=0.9", "nbformat>=5.9", "ipykernel>=6.25"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::RuntimeWarning"]
