name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[notebooks,dev]"

      - name: Run tests
        run: pytest -q

      - name: Regenerate the synthetic dataset and check it is unchanged
        run: |
          python data/make_synthetic_cohort.py
          git diff --exit-code data/synthetic_cohort.csv

      - name: Execute every notebook
        run: |
          python -m ipykernel install --user --name python3
          for nb in notebooks/*.ipynb; do
            jupyter nbconvert --to notebook --execute "$nb" \
              --ExecutePreprocessor.timeout=600 --stdout > /dev/null
          done
